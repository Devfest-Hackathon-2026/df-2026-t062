name: Browser E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  care-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careman_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d careman_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install PDF renderer and Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/careman_e2e
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: care-plan-browser-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
